<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallop SG Content Manager</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const hasInviteToken = /(?:^|[&#])invite_token=/.test(window.location.hash);

    if (window.netlifyIdentity) {
      document.addEventListener('click', event => {
        const loginButton = event.target.closest('button, a');
        if (!loginButton) return;

        const label = loginButton.textContent.trim().toLowerCase();
        if (!label.includes('login with netlify identity')) return;

        event.preventDefault();
        window.netlifyIdentity.open();
      });

      window.netlifyIdentity.on('init', user => {
        if (hasInviteToken && !user) {
          window.netlifyIdentity.open('signup');
        }

        if (!user) return;

        window.netlifyIdentity.close();
        if (!window.location.pathname.endsWith('/admin/')) {
          window.location.assign('https://gallopsg.netlify.app/admin/');
        }
      });

      window.netlifyIdentity.on('login', () => {
        window.netlifyIdentity.close();
        window.location.assign('https://gallopsg.netlify.app/admin/');
      });

      window.netlifyIdentity.init();
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
