<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promotions | Gallop SG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand home-site-brand" href="index.html">
        <div class="home-brand-lockup">
          <span class="home-brand-oval">
            <img src="../../images/logo.png" alt="Gallop SG logo" class="logo-img" />
          </span>
          <span class="home-brand-tagline">Galloping Towards Inclusion</span>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">Gallop SG</p>
          <h1>Gallop Stable</h1>
        </div>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation menu"><span></span><span></span><span></span></button>
      <nav class="main-nav" id="primary-nav" aria-label="Primary navigation"></nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <img src="../../images/home1.jpeg" alt="Riders at Gallop SG" />
      <div class="page-hero-copy reveal">
        <p class="eyebrow">Promotions</p>
        <h2>Exclusive offers for guests</h2>
        <p>Discover timed promotions that enhance every visit, from family packages to event savings.</p>
      </div>
    </section>
    <section class="promotions-poster-section">
      <div class="promotions-poster-grid promotion-carousel promotion-carousel-portrait" aria-label="Portrait promotions">
        <div class="promotion-carousel-track">
          <img src="../../images/uploads/gallop-sg-national-day-family-bundle.png" alt="Gallop SG National Day Family Bundle promotion for Singapore's 61st birthday" loading="lazy" />
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>
  <script src="../../js/script.js?v=20260806-1"></script>
</body>
</html>
